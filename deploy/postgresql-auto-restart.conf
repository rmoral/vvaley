# Drop-in para autorrestaurar el cluster Postgres si crashea.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/postgresql@12-main.service.d/
#   sudo install -m 0644 deploy/postgresql-auto-restart.conf \
#     /etc/systemd/system/postgresql@12-main.service.d/auto-restart.conf
#   sudo systemctl daemon-reload
#
# Para PG17 (en la futura migración) cambia "12-main" por "17-main" en
# la ruta — el contenido del fichero es idéntico.

[Unit]
# Si PG falla más de 5 veces en 5 minutos, deja de intentar. Eso evita
# bucles infinitos si el data dir está corrupto y obliga al watchdog
# (y al monitor externo) a chillar.
StartLimitBurst=5
StartLimitIntervalSec=300

[Service]
# El paquete de Ubuntu no define Restart=. Lo añadimos aquí. `on-failure`
# cubre exit code != 0 (SEGV del postmaster, OOM kill, etc.). `RestartSec`
# da margen para que el filesystem se asiente antes de reintentar.
Restart=on-failure
RestartSec=10s
