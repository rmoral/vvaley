# /etc/apache2/sites-available/vvaley.conf
#
# Reverse-proxy Apache → Next.js (systemd) listening on 127.0.0.1:3015.
#
# Required modules (run once on the EC2 host):
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2dissite 000-default
#   sudo a2ensite vvaley
#   sudo systemctl reload apache2
#
# Get certs with certbot:
#   sudo certbot --apache -d valiravalley.com -d www.valiravalley.com

<VirtualHost *:80>
    ServerName valiravalley.com
    ServerAlias www.valiravalley.com

    # Let certbot handle the redirect once HTTPS is configured.
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName valiravalley.com
    ServerAlias www.valiravalley.com

    # SSLEngine on
    # SSLCertificateFile      /etc/letsencrypt/live/valiravalley.com/fullchain.pem
    # SSLCertificateKeyFile   /etc/letsencrypt/live/valiravalley.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests     Off

    # Forward all traffic to the Node app.
    ProxyPass        / http://127.0.0.1:3015/ retry=1 acquire=3000 timeout=600 Keepalive=On
    ProxyPassReverse / http://127.0.0.1:3015/

    # Tell the app it's behind HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/vvaley-error.log
    CustomLog ${APACHE_LOG_DIR}/vvaley-access.log combined
</VirtualHost>
