name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push encima de otro cancela el anterior: no tiene sentido gastar minutos
# validando un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Los tests corren con el runner de node y tsx, sin framework: vitest
      # arrastraba rolldown y sus 15 binarios de plataforma, y la política de
      # supply-chain de pnpm (minimumReleaseAge) los rechazaba en el servidor
      # por recién publicados. Un runner sin dependencias no tiene ese problema.
      - name: Tests
        run: pnpm test

      # El build no necesita base de datos: las páginas son force-dynamic y las
      # imágenes OG se generan bajo demanda, no al construir. Comprobado.
      # Aun así Prisma exige que DATABASE_URL exista para generar el cliente.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          AUTH_SECRET: ci-no-es-un-secreto-real
          PUBLIC_SITE_URL: https://valiravalley.com
