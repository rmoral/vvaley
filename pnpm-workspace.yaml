# pnpm settings for this project (moved out of package.json in pnpm 11).
# Docs: https://pnpm.io/settings
#
# Whitelist of dependencies allowed to run install-time scripts.
# Without this, pnpm 10.4+/11 blocks all postinstalls and exits with
# ERR_PNPM_IGNORED_BUILDS, breaking `pnpm install` in CI/prod.
#
# `allowBuilds` is the pnpm 11 format. Older `onlyBuiltDependencies`
# (list) is silently ignored by pnpm 11 — do not re-add it.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
